<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">GyaanGuru</title>
  <desc id="d">Personal learning roadmaps for India, mapped to NSQF levels. A learner climbs coloured steps labelled L3 to L6 toward a flag.</desc>
  <defs>
    <pattern id="rules" width="32" height="32" patternUnits="userSpaceOnUse">
      <line x1="0" y1="31.5" x2="32" y2="31.5" stroke="#c8dbf0" stroke-width="1"/>
    </pattern>
    <style>
      .display { font-family: "Arial Black", "Archivo Black", Impact, "Helvetica Neue", sans-serif; font-weight: 900; }
      .body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .hand { font-family: "Kalam", "Segoe Print", "Bradley Hand", "Nirmala UI", "Kohinoor Devanagari", "Mangal", cursive; font-weight: 700; }
    </style>
  </defs>

  <!-- notebook page with hard shadow -->
  <rect x="20" y="20" width="1248" height="368" rx="26" fill="#15171e"/>
  <rect x="10" y="10" width="1248" height="368" rx="26" fill="#fff8e8" stroke="#15171e" stroke-width="3"/>
  <rect x="12" y="12" width="1244" height="364" rx="24" fill="url(#rules)" opacity="0.8"/>
  <line x1="78" y1="12" x2="78" y2="376" stroke="#f19a90" stroke-width="2.5"/>
  <g fill="#fff8e8" stroke="#15171e" stroke-width="2.5">
    <circle cx="44" cy="96" r="9"/><circle cx="44" cy="194" r="9"/><circle cx="44" cy="292" r="9"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(108 70)">
    <rect x="4" y="4" width="68" height="68" rx="18" fill="#15171e"/>
    <rect x="0" y="0" width="68" height="68" rx="18" fill="#ffc83d" stroke="#15171e" stroke-width="3"/>
    <path d="M14 48c7-4 13-4 20 0V24c-7-4-13-4-20 0z" fill="#fff" stroke="#15171e" stroke-width="3" stroke-linejoin="round"/>
    <path d="M34 48c7-4 13-4 20 0V24c-7-4-13-4-20 0z" fill="#2ec4b6" stroke="#15171e" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="54" cy="14" r="6.5" fill="#ff7a66" stroke="#15171e" stroke-width="3"/>
  </g>

  <!-- wordmark -->
  <text x="196" y="130" class="display" font-size="74" fill="#15171e" letter-spacing="-1">GyaanGuru</text>
  <text x="200" y="176" class="hand" font-size="30" fill="#b23a27">ज्ञान · गुरु</text>

  <!-- highlighted tagline -->
  <path d="M106 214 C 300 206, 520 210, 690 206 L 692 252 C 520 256, 300 252, 104 258 Z" fill="#ffc83d" opacity="0.85"/>
  <text x="116" y="242" class="body" font-size="27" font-weight="800" fill="#15171e">Personal learning roadmaps for India,</text>
  <text x="116" y="290" class="body" font-size="27" font-weight="800" fill="#15171e">mapped to NSQF levels.</text>
  <path d="M116 302 C 190 296, 260 308, 340 300 S 420 296, 448 301" fill="none" stroke="#ff7a66" stroke-width="5" stroke-linecap="round"/>

  <!-- stack stickers -->
  <g class="body" font-size="16" font-weight="800" fill="#15171e">
    <g transform="translate(110 322) rotate(-3)">
      <rect x="3" y="3" width="128" height="34" rx="17" fill="#15171e"/>
      <rect width="128" height="34" rx="17" fill="#9be36d" stroke="#15171e" stroke-width="2.5"/>
      <text x="64" y="23" text-anchor="middle">Next.js 16</text>
    </g>
    <g transform="translate(252 324) rotate(2)">
      <rect x="3" y="3" width="118" height="34" rx="17" fill="#15171e"/>
      <rect width="118" height="34" rx="17" fill="#2ec4b6" stroke="#15171e" stroke-width="2.5"/>
      <text x="59" y="23" text-anchor="middle">Supabase</text>
    </g>
    <g transform="translate(384 322) rotate(-2)">
      <rect x="3" y="3" width="104" height="34" rx="17" fill="#15171e"/>
      <rect width="104" height="34" rx="17" fill="#ff7a66" stroke="#15171e" stroke-width="2.5"/>
      <text x="52" y="23" text-anchor="middle">Gemini</text>
    </g>
    <g transform="translate(502 324) rotate(3)">
      <rect x="3" y="3" width="128" height="34" rx="17" fill="#15171e"/>
      <rect width="128" height="34" rx="17" fill="#ffa8d5" stroke="#15171e" stroke-width="2.5"/>
      <text x="64" y="23" text-anchor="middle">NSQF L3–L6</text>
    </g>
  </g>

  <!-- staircase scene -->
  <g transform="translate(760 34)" stroke="#15171e" stroke-width="3" stroke-linejoin="round">
    <circle cx="250" cy="160" r="150" fill="#d6f5f1"/>
    <circle cx="420" cy="54" r="34" fill="#ffc83d"/>
    <path d="M60 300 C 110 250, 90 230, 150 222 S 240 180, 290 150 S 360 100, 410 92" fill="none" stroke="#15171e" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
    <!-- steps with hard shadows -->
    <g>
      <rect x="126" y="246" width="70" height="72" rx="10" fill="#15171e"/>
      <rect x="120" y="240" width="70" height="72" rx="10" fill="#6cb8ff"/>
      <rect x="196" y="200" width="70" height="118" rx="10" fill="#15171e"/>
      <rect x="190" y="194" width="70" height="118" rx="10" fill="#9be36d"/>
      <rect x="266" y="154" width="70" height="164" rx="10" fill="#15171e"/>
      <rect x="260" y="148" width="70" height="164" rx="10" fill="#ffc83d"/>
      <rect x="336" y="108" width="70" height="210" rx="10" fill="#15171e"/>
      <rect x="330" y="102" width="70" height="210" rx="10" fill="#ff7a66"/>
    </g>
    <g class="display" font-size="20" fill="#15171e" stroke="none" text-anchor="middle">
      <text x="155" y="272">L3</text><text x="225" y="226">L4</text><text x="295" y="180">L5</text><text x="365" y="134">L6</text>
    </g>
    <!-- flag -->
    <rect x="388" y="40" width="5" height="64" rx="2.5" fill="#15171e" stroke="none"/>
    <path d="M393 42 L432 55 L393 68 Z" fill="#2ec4b6"/>
    <!-- learner on L4 -->
    <g>
      <rect x="212" y="166" width="10" height="28" rx="5" fill="#15171e"/>
      <rect x="226" y="166" width="10" height="28" rx="5" fill="#15171e"/>
      <rect x="203" y="126" width="13" height="30" rx="6" fill="#ffc83d"/>
      <rect x="209" y="118" width="32" height="54" rx="14" fill="#2ec4b6"/>
      <path d="M237 132 L259 108" stroke-width="9" stroke-linecap="round" stroke="#2ec4b6"/>
      <path d="M237 132 L259 108" fill="none" stroke-width="2"/>
      <circle cx="261" cy="105" r="6" fill="#b9784a"/>
      <circle cx="225" cy="102" r="15" fill="#b9784a"/>
      <path d="M210 100 a15 15 0 0 1 30 -2 c-6 -3 -14 -2 -20 3 c-3 2 -6 2 -10 -1z" fill="#2a2320"/>
    </g>
    <!-- points sticker -->
    <g transform="translate(18 120) rotate(-8)">
      <rect x="3" y="3" width="96" height="40" rx="20" fill="#15171e"/>
      <rect width="96" height="40" rx="20" fill="#ffc83d"/>
      <text x="48" y="27" text-anchor="middle" class="body" font-size="17" font-weight="900" fill="#15171e" stroke="none">★ +5 pts</text>
    </g>
  </g>
  <text x="1236" y="364" class="hand" font-size="20" fill="#4f5566" text-anchor="end">plan it · learn it · level up</text>
</svg>
